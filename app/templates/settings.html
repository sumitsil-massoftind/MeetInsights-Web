{% extends "base.html" %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">Settings</h1>
  <p class="page-subtitle">Workspace preferences — UI shell only.</p>
</div>

<div class="row g-4">
  <div class="col-lg-8">
    <div class="mi-card mb-3">
      <div class="mi-card-body">
        <h2 class="section-title"><i class="bi bi-person text-muted-mi"></i> Profile</h2>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Display name</label>
            <input type="text" class="form-control" value="{{ request.state.user.name if request.state.user else '' }}" readonly>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold">Email</label>
            <input type="email" class="form-control" value="{{ request.state.user.email if request.state.user else '' }}" readonly>
          </div>
        </div>
      </div>
    </div>

    <div class="mi-card mb-3">
      <div class="mi-card-body">
        <h2 class="section-title"><i class="bi bi-palette text-muted-mi"></i> Appearance</h2>
        <div class="form-check form-switch">
          <input class="form-check-input" type="checkbox" id="themeLight" checked disabled>
          <label class="form-check-label" for="themeLight">Light theme (only)</label>
        </div>
        <p class="small text-muted-mi mt-2 mb-0">Dark mode is not available in this UI mock.</p>
      </div>
    </div>

    <div class="mi-card">
      <div class="mi-card-body">
        <h2 class="section-title"><i class="bi bi-bell text-muted-mi"></i> Notifications</h2>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="n1" checked disabled>
          <label class="form-check-label" for="n1">Meeting processing complete</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="n2" checked disabled>
          <label class="form-check-label" for="n2">Action item reminders</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="n3" disabled>
          <label class="form-check-label" for="n3">Weekly digest email</label>
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-4">
    <div class="mi-card">
      <div class="mi-card-body">
        <h2 class="section-title"><i class="bi bi-shield-check text-muted-mi"></i> Workspace</h2>
        <p class="small text-muted-mi mb-2">Insight Labs</p>
        <p class="small mb-0">Settings controls are present for visual completeness only. No values are saved.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
