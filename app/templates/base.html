<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ page_title or "Meet Insights" }}{% endblock %} · Meet Insights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/app.css') }}" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body>
  {% if bare_layout %}
    {% block bare %}{% endblock %}
  {% else %}
  <div class="app-shell">
    {% include "components/navbar.html" %}
    <div class="app-body">
      {% include "components/sidebar.html" %}
      <main class="main-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% endif %}

  <div id="toast-host" class="toast-host"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', path='js/vendor/socket.io.min.js') }}"></script>
  <script src="{{ url_for('static', path='js/auth.js') }}"></script>
  <script src="{{ url_for('static', path='js/navigation.js') }}"></script>
  <script src="{{ url_for('static', path='js/app.js') }}"></script>
  <script src="{{ url_for('static', path='js/summary-socket.js') }}"></script>
  <script src="{{ url_for('static', path='js/chat.js') }}"></script>
  <script src="{{ url_for('static', path='js/bots.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
