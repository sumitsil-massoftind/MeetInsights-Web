{# Reusable form: select platform + paste meeting link (UI mock only) #}
<section class="mi-card join-meeting-card {% if compact %}join-meeting-card-compact{% endif %}">
  <div class="mi-card-body">
    {% if not compact %}
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-3">
      <div>
        <h2 class="section-title mb-1">
          <i class="bi bi-plus-circle text-muted-mi"></i> Join a meeting
        </h2>
        <p class="text-muted-mi small mb-0">Choose a platform and paste the meeting link to start recording intelligence.</p>
      </div>
    </div>
    {% else %}
    <h2 class="section-title mb-3">
      <i class="bi bi-plus-circle text-muted-mi"></i> Join a meeting
    </h2>
    {% endif %}

    <form
      class="join-meeting-form"
      hx-post="/meetings/join"
      hx-target="#toast-host"
      hx-swap="innerHTML"
    >
      <div class="mb-3">
        <label class="form-label small fw-semibold mb-2">Platform</label>
        <div class="platform-picker" role="radiogroup" aria-label="Meeting platform">
          <label class="platform-option">
            <input type="radio" name="platform" value="google_meet" checked>
            <span class="platform-option-face">
              <i class="bi bi-camera-video"></i>
              <span>Google Meet</span>
            </span>
          </label>
          <label class="platform-option">
            <input type="radio" name="platform" value="zoom">
            <span class="platform-option-face">
              <i class="bi bi-camera-reels"></i>
              <span>Zoom</span>
            </span>
          </label>
          <label class="platform-option">
            <input type="radio" name="platform" value="teams">
            <span class="platform-option-face">
              <i class="bi bi-people"></i>
              <span>Microsoft Teams</span>
            </span>
          </label>
        </div>
      </div>

      <div class="row g-3 align-items-end">
        <div class="col-lg-8">
          <label for="meeting-url" class="form-label small fw-semibold">Meeting link</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted-mi">
              <i class="bi bi-link-45deg"></i>
            </span>
            <input
              type="url"
              class="form-control border-start-0"
              id="meeting-url"
              name="meeting_url"
              placeholder="https://meet.google.com/abc-defg-hij"
              required
              autocomplete="off"
            >
          </div>
        </div>
        <div class="col-lg-4">
          <label for="meeting-title" class="form-label small fw-semibold">
            Meeting name <span class="text-muted-mi fw-normal">(optional)</span>
          </label>
          <input
            type="text"
            class="form-control"
            id="meeting-title"
            name="title"
            placeholder="e.g. Weekly product sync"
            autocomplete="off"
          >
        </div>
      </div>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3 pt-1">
        <p class="small text-muted-mi mb-0">
          Supports Google Meet, Zoom, and Teams links.
        </p>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-broadcast me-1"></i> Start meeting
        </button>
      </div>
    </form>
  </div>
</section>
