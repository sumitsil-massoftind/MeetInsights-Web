<nav class="top-navbar d-flex align-items-center px-3 px-lg-4">
  <div class="d-flex align-items-center gap-2 me-3 me-lg-4">
    <a href="/dashboard" class="d-flex align-items-center gap-2 text-decoration-none">
      <span class="brand-mark">MI</span>
      <span class="brand-name d-none d-sm-inline">Meet Insights</span>
    </a>
  </div>

  <div class="navbar-search position-relative flex-grow-1 mx-auto">
    <i class="bi bi-search search-icon"></i>
    <input
      type="search"
      class="form-control form-control-sm"
      placeholder="Search meetings, projects…"
      aria-label="Search"
    >
  </div>

  <div class="d-flex align-items-center gap-2 ms-3">
    <button type="button" class="btn btn-sm btn-light border d-none d-md-inline-flex" title="Notifications">
      <i class="bi bi-bell"></i>
    </button>
    <div class="dropdown">
      <button
        class="btn p-0 border-0 bg-transparent d-flex align-items-center gap-2"
        type="button"
        data-bs-toggle="dropdown"
        aria-expanded="false"
      >
        <span class="avatar">{{ request.state.user_initials if request.state.user_initials else "U" }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm border">
        <li>
          <h6 class="dropdown-header mb-0">
            {{ request.state.user.name if request.state.user else "Account" }}
          </h6>
        </li>
        {% if request.state.user and request.state.user.email %}
        <li><span class="dropdown-item-text small text-muted-mi py-0">{{ request.state.user.email }}</span></li>
        {% endif %}
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item" href="/settings"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><a class="dropdown-item" href="/logout"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
      </ul>
    </div>
  </div>
</nav>
